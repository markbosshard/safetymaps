<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Grey rounded-square background -->
  <rect width="100" height="100" rx="14" fill="#374151"/>
  <!--
    South America silhouette, clockwise from Colombia/Panama Pacific border.
    Coordinate mapping: x = 18 + (81 - lon°W) / 46 * 64
                        y =  5 + (12 - lat°N) / 67 * 90   (lat negative = south)
  -->
  <path fill="#f1f5f9" d="
    M 24,10
    L 28,6  L 31,5  L 37,6  L 43,8  L 50,10
    L 60,16 L 72,27 L 82,31
    L 78,40 L 75,48 L 71,52
    L 64,59 L 58,64 L 50,68
    L 44,74 L 37,83 L 33,93
    L 37,95 L 32,93
    L 29,88 L 29,71 L 31,65
    L 33,52 L 24,37 L 19,24
    L 24,14 Z
  "/>
  <!-- 6 larger dots spread top-to-bottom, alternating green/red -->
  <circle cx="34" cy="20" r="7"  fill="#22c55e"/> <!-- Colombia/Bogotá -->
  <circle cx="57" cy="30" r="9"  fill="#ef4444"/> <!-- NE Brazil/Fortaleza -->
  <circle cx="64" cy="49" r="9"  fill="#ef4444"/> <!-- Rio de Janeiro -->
  <circle cx="50" cy="55" r="8"  fill="#22c55e"/> <!-- São Paulo -->
  <circle cx="50" cy="67" r="9"  fill="#22c55e"/> <!-- Buenos Aires -->
  <circle cx="37" cy="78" r="7"  fill="#ef4444"/> <!-- Patagonia/south -->
</svg>
